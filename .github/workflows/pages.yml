name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site under the canonical namespace path
        run: |
          mkdir -p _site/open/core/v0.1
          rsync -a --exclude='.git' --exclude='_site' --exclude='.github' ./ _site/open/core/v0.1/
          echo "prudence.signalprivatemarkets.com" > _site/CNAME
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><title>PRUDENCE open-core</title><meta http-equiv="refresh" content="0; url=/open/core/v0.1/"><body><p>PRUDENCE open-core ontology &rarr; <a href="/open/core/v0.1/">/open/core/v0.1/</a></p></body></html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
